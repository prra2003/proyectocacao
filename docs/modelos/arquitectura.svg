<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><title>Arquitectura de Cacaiva</title><defs><marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F1A17"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="60" y="50" font-size="14" font-weight="bold" font-style="normal" text-anchor="start" fill="#6B625B" font-family="Helvetica, Arial, sans-serif">EN EL TELÉFONO</text><rect x="40" y="62" width="760" height="760" rx="18" fill="none" stroke="#6B625B" stroke-width="1.5" stroke-dasharray="8 6"/><rect x="80" y="90" width="680" height="120" rx="12" fill="#F3E7D6" stroke="#5A3A22" stroke-width="2"/><text x="420.0" y="124" font-size="19" font-weight="bold" font-style="normal" text-anchor="middle" fill="#5A3A22" font-family="Helvetica, Arial, sans-serif">1 · Interfaz de usuario (Flutter)</text><text x="420.0" y="152.0" font-size="14" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1F1A17" font-family="Helvetica, Arial, sans-serif">Inicio · Lote · Anotar · Reportes · Costo por kilo · Perfil</text><text x="420.0" y="169.5" font-size="14" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1F1A17" font-family="Helvetica, Arial, sans-serif">Lo que ve y toca el productor</text><rect x="80" y="270" width="680" height="140" rx="12" fill="#FFFFFF" stroke="#5A3A22" stroke-width="2"/><text x="420.0" y="304" font-size="19" font-weight="bold" font-style="normal" text-anchor="middle" fill="#5A3A22" font-family="Helvetica, Arial, sans-serif">2 · Lógica de la aplicación</text><text x="420.0" y="332.0" font-size="14" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1F1A17" font-family="Helvetica, Arial, sans-serif">Repositorios: Perfil · Lote · Reportes</text><text x="420.0" y="349.5" font-size="14" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1F1A17" font-family="Helvetica, Arial, sans-serif">Recordatorios · Costo por kilo · Plazo de 7 días</text><text x="420.0" y="367.0" font-size="14" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1F1A17" font-family="Helvetica, Arial, sans-serif">Reglas de negocio, sin pantallas ni red</text><rect x="80" y="470" width="680" height="130" rx="12" fill="#E6F0E8" stroke="#2E5233" stroke-width="2"/><text x="420.0" y="504" font-size="19" font-weight="bold" font-style="normal" text-anchor="middle" fill="#2E5233" font-family="Helvetica, Arial, sans-serif">3 · Base de datos local (Drift / SQLite)</text><text x="420.0" y="532.0" font-size="14" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1F1A17" font-family="Helvetica, Arial, sans-serif">FUENTE DE VERDAD: todo se guarda aquí primero</text><text x="420.0" y="549.5" font-size="14" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1F1A17" font-family="Helvetica, Arial, sans-serif">Funciona sin señal</text><rect x="80" y="660" width="680" height="130" rx="12" fill="#FFFFFF" stroke="#6B625B" stroke-width="2"/><text x="420.0" y="694" font-size="19" font-weight="bold" font-style="normal" text-anchor="middle" fill="#6B625B" font-family="Helvetica, Arial, sans-serif">Servicio de sincronización</text><text x="420.0" y="722.0" font-size="14" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1F1A17" font-family="Helvetica, Arial, sans-serif">Sube lo pendiente, baja lo nuevo</text><text x="420.0" y="739.5" font-size="14" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1F1A17" font-family="Helvetica, Arial, sans-serif">Borrado suave · sellos del servidor · conflictos</text><polyline points="420,210 420,270" fill="none" stroke="#1F1A17" stroke-width="1.8" marker-end="url(#punta)"/><polyline points="440,270 440,210" fill="none" stroke="#1F1A17" stroke-width="1.8" marker-end="url(#punta)"/><polyline points="420,410 420,470" fill="none" stroke="#1F1A17" stroke-width="1.8" marker-end="url(#punta)"/><polyline points="440,470 440,410" fill="none" stroke="#1F1A17" stroke-width="1.8" marker-end="url(#punta)"/><polyline points="420,600 420,660" fill="none" stroke="#1F1A17" stroke-width="1.8" marker-end="url(#punta)"/><polyline points="440,660 440,600" fill="none" stroke="#1F1A17" stroke-width="1.8" marker-end="url(#punta)"/><text x="880" y="585" font-size="14" font-weight="bold" font-style="normal" text-anchor="start" fill="#6B625B" font-family="Helvetica, Arial, sans-serif">EN LA NUBE</text><rect x="880" y="600" width="460" height="220" rx="12" fill="#FFFFFF" stroke="#5A3A22" stroke-width="2"/><text x="1110.0" y="634" font-size="19" font-weight="bold" font-style="normal" text-anchor="middle" fill="#5A3A22" font-family="Helvetica, Arial, sans-serif">Google Apps Script</text><text x="1110.0" y="662.0" font-size="14" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1F1A17" font-family="Helvetica, Arial, sans-serif">Sesiones con la cuenta de Google</text><text x="1110.0" y="679.5" font-size="14" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1F1A17" font-family="Helvetica, Arial, sans-serif">Recibe y entrega los registros</text><text x="1110.0" y="697.0" font-size="14" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1F1A17" font-family="Helvetica, Arial, sans-serif"></text><text x="1110.0" y="714.5" font-size="14" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1F1A17" font-family="Helvetica, Arial, sans-serif">Google Sheets</text><text x="1110.0" y="732.0" font-size="14" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1F1A17" font-family="Helvetica, Arial, sans-serif">Una hoja por tabla</text><polyline points="760,715 880,715" fill="none" stroke="#1F1A17" stroke-width="1.8" marker-end="url(#punta)"/><polyline points="880,745 760,745" fill="none" stroke="#1F1A17" stroke-width="1.8" marker-end="url(#punta)"/><text x="840" y="700" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle" fill="#6B625B" font-family="Helvetica, Arial, sans-serif">HTTPS</text><text x="840" y="772.0" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle" fill="#6B625B" font-family="Helvetica, Arial, sans-serif">cuando</text><text x="840" y="788.25" font-size="13" font-weight="normal" font-style="normal" text-anchor="middle" fill="#6B625B" font-family="Helvetica, Arial, sans-serif">hay señal</text><text x="880" y="140" font-size="17" font-weight="bold" font-style="normal" text-anchor="start" fill="#5A3A22" font-family="Helvetica, Arial, sans-serif">La aplicación es offline-first</text><text x="880" y="190" font-size="15" font-weight="bold" font-style="normal" text-anchor="start" fill="#1F1A17" font-family="Helvetica, Arial, sans-serif">Nunca espera al servidor.</text><text x="880" y="212.0" font-size="15" font-weight="normal" font-style="normal" text-anchor="start" fill="#6B625B" font-family="Helvetica, Arial, sans-serif">Todo se guarda primero en el teléfono.</text><text x="880" y="282" font-size="15" font-weight="bold" font-style="normal" text-anchor="start" fill="#1F1A17" font-family="Helvetica, Arial, sans-serif">Cada registro queda «pendiente».</text><text x="880" y="304.0" font-size="15" font-weight="normal" font-style="normal" text-anchor="start" fill="#6B625B" font-family="Helvetica, Arial, sans-serif">Con señal, se sube lo pendiente</text><text x="880" y="322.75" font-size="15" font-weight="normal" font-style="normal" text-anchor="start" fill="#6B625B" font-family="Helvetica, Arial, sans-serif">y se baja lo nuevo.</text><text x="880" y="374" font-size="15" font-weight="bold" font-style="normal" text-anchor="start" fill="#1F1A17" font-family="Helvetica, Arial, sans-serif">Las capas 1, 2 y 3</text><text x="880" y="396.0" font-size="15" font-weight="normal" font-style="normal" text-anchor="start" fill="#6B625B" font-family="Helvetica, Arial, sans-serif">son los tres componentes que pide</text><text x="880" y="414.75" font-size="15" font-weight="normal" font-style="normal" text-anchor="start" fill="#6B625B" font-family="Helvetica, Arial, sans-serif">el documento del seminario.</text><text x="880" y="466" font-size="15" font-weight="bold" font-style="normal" text-anchor="start" fill="#1F1A17" font-family="Helvetica, Arial, sans-serif">La nube permite compartir una cuenta</text><text x="880" y="488.0" font-size="15" font-weight="normal" font-style="normal" text-anchor="start" fill="#6B625B" font-family="Helvetica, Arial, sans-serif">entre dos teléfonos, y que la Red</text><text x="880" y="506.75" font-size="15" font-weight="normal" font-style="normal" text-anchor="start" fill="#6B625B" font-family="Helvetica, Arial, sans-serif">vea la información consolidada.</text></svg>
